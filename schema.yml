components:
  schemas:
    PatchedProductCategory:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        parent_category:
          type: string
          readOnly: true
    PatchedShop:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        deleted:
          type: boolean
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 15
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        logo:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        owner:
          type: integer
    ProductCategory:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        parent_category:
          type: string
          readOnly: true
      required:
      - name
      - parent_category
    Shop:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        deleted:
          type: boolean
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 15
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        logo:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        owner:
          type: integer
      required:
      - address
      - city
      - created_at
      - id
      - name
      - owner
      - phone_number
      - updated_at
    UserLogin:
      type: object
      properties:
        phone_number:
          type: string
        password:
          type: string
      required:
      - password
      - phone_number
    UserRegistration:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 60
        last_name:
          type: string
          maxLength: 60
        phone_number:
          type: string
          maxLength: 15
        password:
          type: string
          title: گذرواژه
          maxLength: 128
      required:
      - password
      - phone_number
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
